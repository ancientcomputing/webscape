# Keeps the browser engine (Electron, which bundles Chromium) and other
# dependencies current. Dependabot opens a pull request for each update, and
# CI (.github/workflows/ci.yml) builds and smoke-tests it before you merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # The engine gets its own pull request so security releases aren't held
      # up by unrelated changes.
      electron:
        patterns: ["electron"]
      tracker-blocker:
        patterns: ["@ghostery/*"]
      build-tools:
        patterns: ["typescript", "@types/*", "electron-builder"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
