name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and smoke test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Match the Node/npm the project is developed with, so `npm ci` reads
          # the lockfile the same way. Bump this together with your local Node.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Launches the real browser, checks the UI loads, tabs get separate
      # in-memory sessions and the user agent hides Electron, then quits.
      - name: Smoke test
        run: npx electron .
        env:
          WEBSCAPE_SMOKE_TEST: "1"
