name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and smoke test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Match the Node/npm the project is developed with, so `npm ci` reads
          # the lockfile the same way. Bump this together with your local Node.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The on-device AI helper (Swift + LocalLM Lab SDK 3.0.0-GA binary).
      - name: Build AI helper
        run: npm run build:ai

      # The helper must start and answer a status request. CI machines have no
      # Apple Intelligence, so "available" is expected to be false there.
      - name: AI helper responds
        timeout-minutes: 2
        run: |
          reply=$(echo '{"id":"1","op":"status"}' | native/webscape-ai/.build/release/webscape-ai)
          echo "$reply"
          echo "$reply" | grep -q '"ok":true'

      # Launches the real browser, checks the UI loads, tabs get separate
      # in-memory sessions and the user agent hides Electron, then quits.
      - name: Smoke test
        run: npx electron .
        env:
          WEBSCAPE_SMOKE_TEST: "1"

      # Encrypts, saves, locks, unlocks and decrypts a throwaway vault through
      # the real macOS Keychain, and opens a vault written by older versions.
      - name: Password vault test
        timeout-minutes: 3
        run: npx electron scripts/vault-test.cjs

      # Encrypted bookmarks: tracking-parameter removal, folders, undo, the
      # optional Touch ID lock and bookmarks.html import/export round trips.
      - name: Bookmarks test
        timeout-minutes: 3
        run: npx electron scripts/bookmarks-test.cjs
