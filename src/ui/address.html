<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Address</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="address.css">
  <script type="module" src="address.js"></script>
</head>
<body class="popover-body">
  <div id="pop" class="pop" data-mode="peek">
    <span id="lock" class="pop-lock" aria-hidden="true"></span>
    <div id="peek" class="pop-peek" title="Click to edit"></div>
    <textarea id="edit" class="pop-edit" rows="1" spellcheck="false" autocomplete="off" aria-label="Address"
      placeholder="Search or enter address"></textarea>
    <button id="star" class="pop-star" type="button" title="Bookmark this page (⌘D)" aria-label="Bookmark this page" hidden>
      <svg viewBox="0 0 16 16"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
    </button>
    <div class="pop-hint" id="hint"></div>
    <ul id="suggest" class="pop-suggest" role="listbox" aria-label="Bookmarks" hidden></ul>
  </div>
</body>
</html>
