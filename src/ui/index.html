<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
  <title>Webscape Obfuscator</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="ui.js"></script>
</head>
<body>
  <aside class="sidebar">
    <header class="titlebar">
      <div class="nav">
        <button id="back" class="icon" title="Back (⌘[)" aria-label="Back">
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
        </button>
        <button id="forward" class="icon" title="Forward (⌘])" aria-label="Forward">
          <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg>
        </button>
        <button id="reload" class="icon" title="Reload (⌘R)" aria-label="Reload">
          <svg viewBox="0 0 16 16" class="i-reload"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
          <svg viewBox="0 0 16 16" class="i-stop"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>

    <form id="address-form" class="address" autocomplete="off">
      <span id="lock" class="lock" aria-hidden="true"></span>
      <input id="address" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Address">
    </form>

    <div class="section-label">
      <span>Private tabs</span>
      <button id="new-tab" class="icon small" title="New private tab (⌘T)" aria-label="New private tab">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>

    <ul id="tabs" class="tabs" role="tablist"></ul>

    <button id="new-tab-row" class="new-tab-row">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      New private tab
    </button>

    <div class="spacer"></div>

    <section id="login-card" class="card" hidden></section>

    <footer class="footer">
      <div class="shield" id="shield" title="Trackers blocked in this tab">
        <svg viewBox="0 0 16 16"><path d="M8 1.5 2.5 3.5v4c0 3.3 2.3 5.8 5.5 7 3.2-1.2 5.5-3.7 5.5-7v-4z"/></svg>
        <span id="shield-text">0 trackers blocked</span>
      </div>
      <button id="vault-button" class="vault-button" title="Passwords (⇧⌘P)">
        <svg viewBox="0 0 16 16"><circle cx="5.5" cy="10.5" r="3"/><path d="M7.6 8.4 13.5 2.5M11 5l1.8 1.8M12.5 3.5l1.5 1.5"/></svg>
        <span>Passwords</span>
        <span id="vault-state" class="pill">Locked</span>
      </button>
    </footer>
  </aside>

  <main id="vault-page" class="vault-page" hidden>
    <div class="vault-inner">
      <header class="vault-header">
        <div>
          <h1>Passwords</h1>
          <p class="muted">Encrypted with your system keychain. The only thing Webscape Obfuscator keeps after you quit.</p>
        </div>
        <div class="vault-actions">
          <button id="vault-lock" class="btn ghost">Lock</button>
          <button id="vault-close" class="btn">Done</button>
        </div>
      </header>

      <div id="vault-locked" class="vault-locked">
        <div class="big-key" aria-hidden="true">
          <svg viewBox="0 0 16 16"><circle cx="5.5" cy="10.5" r="3"/><path d="M7.6 8.4 13.5 2.5M11 5l1.8 1.8M12.5 3.5l1.5 1.5"/></svg>
        </div>
        <p>Your vault is locked.</p>
        <button id="vault-unlock" class="btn primary">Unlock with Touch ID</button>
      </div>

      <div id="vault-open" hidden>
        <div class="vault-grid">
          <section class="panel">
            <div class="panel-head">
              <input id="vault-search" type="search" placeholder="Search sites and usernames" spellcheck="false">
            </div>
            <ul id="vault-list" class="vault-list"></ul>
            <p id="vault-empty" class="muted empty" hidden>No saved passwords yet. Sign in to a site and choose Save when asked.</p>
          </section>

          <aside class="side-panels">
            <section class="panel">
              <h2>Password generator</h2>
              <output id="gen-output" class="gen-output"></output>
              <label class="slider">Length <span id="gen-len-label">20</span>
                <input id="gen-len" type="range" min="12" max="64" value="20">
              </label>
              <label class="check"><input id="gen-symbols" type="checkbox" checked> Symbols</label>
              <div class="row">
                <button id="gen-new" class="btn ghost">Regenerate</button>
                <button id="gen-copy" class="btn">Copy</button>
              </div>
            </section>

            <section class="panel">
              <h2>Add a login</h2>
              <form id="add-form" class="add-form" autocomplete="off">
                <input name="site" placeholder="example.com" required spellcheck="false">
                <input name="username" placeholder="Username or email" spellcheck="false">
                <input name="password" type="password" placeholder="Password" required>
                <p id="add-error" class="error" hidden></p>
                <button class="btn primary" type="submit">Save login</button>
              </form>
            </section>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
